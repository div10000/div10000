name: Generate 3D Contributions

on:
  schedule: # runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate 3d-contrib.svg
        uses: Platane/snk@v3
        with:
          github_user_name: div10000
          outputs: |
            dist/3d-contrib.svg?palette=github-dark&color_snake=#667eea
            dist/3d-contrib-light.svg?palette=github-light&color_snake=#764ba2
          
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
